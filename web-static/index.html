<!doctype html>
<html lang="en" class="my-app-dark">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoHentai | の変態</title>
    <script>
      // 防止主题闪烁：在首帧前定好主题类。
      // 未显式选择过主题时跟随系统偏好，与 useTheme.ts 的判定保持一致。
      (function () {
        var saved = localStorage.getItem('theme')
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.className = 'my-app-' + theme
        document.documentElement.style.setProperty('--mom-mode-blur', '10px')
      })()
    </script>
    <style>
      /* 首屏兜底样式：仅提供背景/前景，避免 style.css 加载前的白闪。
         完整 token 见 src/style.css。 */
      .my-app-dark {
        --text-color: #f1f5f9;
        --bg-color: #0f172a;
      }
      .my-app-light {
        --text-color: #2d3748;
        --bg-color: #faf8f5;
      }
      html,
      body,
      #app {
        background-color: var(--bg-color);
        color: var(--text-color);
      }
      body {
        margin: 0;
      }
      #app {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
