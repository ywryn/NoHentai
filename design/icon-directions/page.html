<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark"><link rel="icon" href="assets/logo-f.png"><title>NoHentai · 图标风格对比</title>
<style>
:root{color-scheme:light;--bg:#f6f7f4;--panel:#fff;--text:#29352f;--muted:#68766e;--line:#dce3d9;--soft:#edf1e9;--accent:#ad4c74;--tint:#ad4c7410;--brand:#ad4c74;--on-accent:#fff;font:14px system-ui,"Noto Sans CJK SC",sans-serif}html[data-theme=dark]{color-scheme:dark;--bg:#151a18;--panel:#1d2420;--text:#e7eeea;--muted:#a2afa7;--line:#3a453e;--soft:#263029;--accent:#efa0c0;--tint:#efa0c010;--brand:#efa0c0;--on-accent:#32222b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit}button:disabled{opacity:.3;cursor:default}a{color:inherit;text-underline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button svg{pointer-events:none}svg{flex-shrink:0;vertical-align:middle}.top{border-bottom:1px solid var(--line)}.top-inner,main,.selection-inner{max-width:1240px;margin:auto;padding-inline:28px}.top-inner{min-height:66px;display:flex;justify-content:space-between;gap:20px;align-items:center}.wordmark{display:flex;align-items:center;gap:8px;font-weight:650;text-decoration:none;letter-spacing:-.04em}.wordmark img{width:34px;height:34px}.top-actions{display:flex;gap:20px;align-items:center;font-size:12px}.quiet{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:9px 12px;min-height:40px}.intro{padding-block:32px 24px}.intro h1{font-size:27px;letter-spacing:-.04em;margin:0 0 10px;font-weight:600}.intro p{color:var(--muted);font-size:13px;line-height:1.8;margin:0}.families{display:grid;grid-template-columns:1fr 1fr;gap:24px}.family{min-width:0;border-top:2px solid var(--line);padding-top:18px}.family[data-selected=true]{border-color:var(--accent)}.family-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.family h2{margin:0;font-size:24px;font-weight:550;letter-spacing:-.04em}.family h2 small{font:12px ui-monospace,monospace;margin-right:10px;color:var(--muted)}.family-subtitle{font-size:12px;color:var(--muted);margin:8px 0}.description{font-size:12px;line-height:1.8;color:var(--muted);margin:12px 0 18px;min-height:44px}.choose{min-height:42px;padding:8px 14px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:12px}.choose[aria-pressed=true]{border-color:var(--accent);background:var(--tint);color:var(--accent)}.scene{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}.scene-head{padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.scene-brand{display:flex;align-items:center;gap:6px;letter-spacing:-.04em;font-weight:600}.scene-brand img{width:30px;height:30px;object-fit:contain}.scene-nav{display:flex;gap:3px;margin-left:auto}.scene-nav button{display:flex;align-items:center;gap:4px;min-height:40px;padding:7px 8px;background:none;border:0;border-radius:4px;font-size:11px;white-space:nowrap}.scene-nav .is-active{background:var(--tint);color:var(--accent)}.scene-body{padding:18px 16px}.search-demo{display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:10px 12px;color:var(--muted);font-size:12px}.search-demo span{flex:1}.scene-tools{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:16px}.small-tools,.pager{display:flex;gap:4px;align-items:center}.demo-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;min-width:36px;border:1px solid var(--line);background:transparent;border-radius:4px;padding:6px;color:var(--text);font-size:12px}.page-counter{min-width:40px;text-align:center;font-size:11px;color:var(--muted)}.reader-demo{margin:18px -16px 0;padding:12px 14px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.reader-action{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:12px;font-weight:550}.signature{display:flex;align-items:center;justify-content:space-evenly;padding:22px 12px 8px;color:var(--brand)}.signature svg{width:38px;height:38px}.signature span{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:10px;color:var(--muted)}.signature svg{color:var(--brand)}.admin-demo{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;gap:14px;font-size:11px;color:var(--muted)}.admin-demo img{width:27px;height:27px;background:#edf2e9;border-radius:3px}.admin-demo span{display:flex;align-items:center;gap:6px}.admin-demo span:last-child{margin-left:auto}.controls{margin-top:36px;padding-block:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.controls h2{font-size:16px;margin:0}.controls p{margin:4px 0 0;color:var(--muted);font-size:11px}.control-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.search-field{border:1px solid var(--line);border-radius:5px;min-height:40px;padding:8px 10px;width:170px;background:var(--panel);color:var(--text);font-size:12px}.sizes{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:5px}.sizes button{min-height:34px;border:0;background:none;color:var(--muted);padding:5px 10px;font-size:11px;border-radius:3px}.sizes button[aria-pressed=true]{color:var(--text);background:var(--panel)}.inventory{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 22px}.glyph-pair{padding:20px 0;border-bottom:1px solid var(--line);min-width:0}.pair-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}.pair-label code{color:var(--muted);font-size:9px}.glyphs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.glyph{display:flex;align-items:center;justify-content:center;gap:14px;min-height:45px;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--brand)}.glyph small{font:9px ui-monospace,monospace;color:var(--muted)}.downloads{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-block:24px;color:var(--muted);font-size:12px}.empty{color:var(--muted);padding:24px 0;font-size:13px}main{padding-bottom:150px}.selection{position:fixed;bottom:0;inset-inline:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}.selection-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}.selection strong{font-size:13px;display:block}.selection p{font-size:11px;line-height:1.6;margin:4px 0 0;color:var(--muted)}.copy{background:var(--accent);color:var(--on-accent);border:0;border-radius:5px;min-height:44px;padding:10px 20px;white-space:nowrap;font-size:12px}#copy-fallback{width:100%;margin-top:8px}.status{font-size:11px;color:var(--accent);min-height:15px;margin-top:3px}[hidden]{display:none!important}
@media(max-width:1050px){.inventory{grid-template-columns:repeat(3,minmax(0,1fr))}.scene-nav{margin-left:0;flex-basis:100%;justify-content:space-between}.scene-tools{flex-wrap:wrap}.admin-demo{gap:10px}}
@media(max-width:720px){.families{grid-template-columns:1fr;gap:30px}.scene-nav{margin-left:auto;flex-basis:auto}.inventory{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}.intro{padding-top:26px}.intro h1{font-size:23px}.top-inner,main,.selection-inner{padding-inline:18px}.description{min-height:0}.controls{align-items:flex-start}.controls,.control-actions{gap:12px}.search-field{width:100%;flex-basis:100%}.control-actions{width:100%}.top-actions{gap:12px}.top-actions a{display:none}.signature{padding-block:22px 12px}.selection-inner{padding-block:12px}.selection p{max-width:230px;font-size:10px}.copy{padding-inline:14px}.pair-label{align-items:flex-start;flex-direction:column;gap:4px}.glyphs{gap:6px}.glyph{gap:8px}.scene-tools{flex-wrap:nowrap}}
@media(max-width:430px){.scene-nav{margin-left:0;flex-basis:100%;justify-content:space-between}.scene-nav button{padding-inline:4px;gap:3px}.scene-body{padding-inline:12px}.demo-button{min-width:30px;padding:5px}.scene-tools{gap:6px}.pager{gap:2px}.page-counter{min-width:34px}.admin-demo{gap:8px;padding-inline:10px}.admin-demo span{gap:4px}.reader-demo{margin-inline:-12px}.top-inner{min-height:60px}.wordmark{font-size:13px}.signature svg{width:32px;height:32px}}
</style></head><body><header class="top"><div class="top-inner"><a class="wordmark" href="./"><img src="assets/logo-f.png" alt="">NoHentai</a><div class="top-actions"><a href="icons.html">当前图标</a><button class="quiet" id="theme" aria-pressed="false" type="button">切换深浅底</button></div></div></header>
<main><div class="intro"><h1>让图标，也有一点 NoHentai。</h1><p>两套完整方向，同样的功能、配色与尺寸。先看场景，再比较细节。</p></div><div class="families" id="families"></div><section class="controls" aria-label="图标比较设置"><div><h2>逐个比较</h2><p>每项左侧 A · 右侧 B，共 46 组</p></div><div class="control-actions"><input id="find" class="search-field" type="search" aria-label="查找图标" placeholder="查找图标…"><div class="sizes" role="group" aria-label="图标尺寸"><button data-size="16" aria-pressed="false">16px</button><button data-size="20" aria-pressed="false">20px</button><button data-size="24" aria-pressed="true">24px</button><button data-size="32" aria-pressed="false">32px</button></div><button id="color" class="quiet" type="button" aria-pressed="true">品牌色</button></div></section><div class="inventory" id="inventory"></div><p class="empty" id="empty" role="status" hidden>没有匹配的图标。</p><footer class="downloads"><a href="assets/icons-direction-a.svg" download="nohentai-icons-A.svg">下载 A · SVG</a><a href="assets/icons-direction-b.svg" download="nohentai-icons-B.svg">下载 B · SVG</a><a href="icons.html">对照当前版本</a></footer></main>
<footer class="selection"><div class="selection-inner"><div><strong id="choice">选择你更喜欢的图标风格</strong><p>只选择图标风格，已选定的 F / B Logo 保持不变。</p><div id="status" class="status" role="status" aria-live="polite"></div><input id="copy-fallback" class="search-field" readonly aria-label="手动复制图标方案" hidden></div><button class="copy" id="copy" type="button" disabled>复制选择</button></div></footer>
<script>
/* ICON_DATA */
const names={home:'首页',chart:'统计',book:'书单','book-open':'阅读',calendar:'每日',translate:'翻译',search:'搜索',filter:'筛选',grid:'封面视图',list:'列表视图',gallery:'画廊',moon:'深色外观',sun:'浅色外观',eye:'查看','eye-off':'隐私模式','chevron-left':'上一页','chevron-right':'下一页','chevron-up':'收起','chevron-down':'展开','first-page':'首页跳转','last-page':'末页跳转','arrow-left':'返回','arrow-right':'前进','arrow-up':'向上','arrow-down':'向下',external:'站外入口',menu:'菜单',close:'关闭',plus:'添加',minus:'减少',check:'完成',edit:'编辑',copy:'复制',save:'保存',trash:'删除',download:'下载',refresh:'刷新',clock:'历史记录',info:'提示',shield:'安全',key:'密钥',logout:'退出',tasks:'任务',pulse:'运行状态',dots:'更多',settings:'设置'};
let size=24,selected=null,brand=true,copyTimer;const pages={A:2,B:2};
function icon(id,name,n=size){const s=sets[id];return `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s.stroke}" stroke-linecap="${s.cap}" stroke-linejoin="${s.join}" aria-hidden="true" focusable="false">${s.icons[name].map(d=>`<path d="${d}"/>`).join('')}</svg>`}
function demoButton(id,name,extra=''){return `<button class="demo-button" type="button" aria-label="${names[name]}" ${extra}>${icon(id,name,18)}</button>`}
for(const [id,s] of Object.entries(sets)){
const el=document.createElement('section');el.className='family';el.dataset.family=id;el.dataset.selected='false';
el.innerHTML=`<div class="family-heading"><div><h2><small>${id}</small>${s.title}</h2><p class="family-subtitle">${s.subtitle}</p></div><button type="button" class="choose" data-choose="${id}" aria-pressed="false">选择 ${id}</button></div><p class="description">${s.description}</p><div class="scene" aria-label="方案 ${id} 场景预览"><div class="scene-head"><div class="scene-brand"><img src="assets/logo-f.png" alt="">NoHentai</div><nav class="scene-nav" aria-label="方案 ${id} 导航预览">${['home','chart','book','calendar','translate'].map((name,i)=>`<button type="button" class="${i===0?'is-active':''}" aria-pressed="${i===0}">${icon(id,name,18)}${names[name]}</button>`).join('')}</nav></div><div class="scene-body"><div class="search-demo">${icon(id,'search',20)}<span>搜索标题、作者、标签</span>${icon(id,'filter',18)}</div><div class="scene-tools"><div class="small-tools">${demoButton(id,'list','data-list="true" aria-pressed="false"')}${demoButton(id,'eye-off','data-privacy="true" aria-pressed="true"')}</div><div class="pager" aria-label="方案 ${id} 分页预览">${demoButton(id,'first-page','data-page="first"')}${demoButton(id,'chevron-left','data-page="prev"')}<span class="page-counter">2 / 8</span>${demoButton(id,'chevron-right','data-page="next"')}${demoButton(id,'last-page','data-page="last"')}</div></div><div class="reader-demo"><span class="reader-action">${icon(id,'book-open',21)}开始阅读</span><div class="small-tools">${demoButton(id,'translate')}${demoButton(id,'settings')}${demoButton(id,'close')}</div></div></div></div><div class="signature">${['search','eye','book-open','translate','gallery'].map(n=>`<span>${icon(id,n,38)}${names[n]}</span>`).join('')}</div><div class="admin-demo"><img src="assets/logo-b.png" alt="Admin 标识"><span>${icon(id,'tasks',18)}任务</span><span>${icon(id,'key',18)}密钥</span><span>${icon(id,'save',18)}保存</span><span>${icon(id,'refresh',18)}刷新</span></div>`;
document.getElementById('families').append(el);
}
function render(){const q=document.getElementById('find').value.trim().toLowerCase();const filtered=Object.keys(names).filter(n=>`${n} ${names[n]}`.toLowerCase().includes(q));document.getElementById('inventory').innerHTML=filtered.map(n=>`<article class="glyph-pair"><div class="pair-label"><span>${names[n]}</span><code>${n}</code></div><div class="glyphs"><div class="glyph" aria-label="方案 A ${names[n]} ${size} 像素"><small>A</small>${icon('A',n)}</div><div class="glyph" aria-label="方案 B ${names[n]} ${size} 像素"><small>B</small>${icon('B',n)}</div></div></article>`).join('');document.getElementById('empty').hidden=filtered.length>0}
function choose(id){if(!sets[id])return;selected=id;document.querySelectorAll('[data-family]').forEach(e=>e.dataset.selected=String(e.dataset.family===id));document.querySelectorAll('[data-choose]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.choose===id));document.getElementById('choice').textContent=`已选图标方案 ${id} · ${sets[id].title}`;document.getElementById('copy').disabled=false;document.getElementById('status').textContent='';document.getElementById('copy-fallback').hidden=true;try{localStorage.setItem('nohentai-icon-direction',id)}catch{}}
document.getElementById('families').addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.choose){choose(button.dataset.choose);return}const card=button.closest('[data-family]'),id=card.dataset.family;if(button.closest('.scene-nav')){card.querySelectorAll('.scene-nav button').forEach(b=>{b.classList.toggle('is-active',b===button);b.setAttribute('aria-pressed',String(b===button))})}if(button.dataset.page){let p=pages[id];p=button.dataset.page==='first'?1:button.dataset.page==='last'?8:button.dataset.page==='prev'?Math.max(1,p-1):Math.min(8,p+1);pages[id]=p;card.querySelector('.page-counter').textContent=`${p} / 8`;card.querySelectorAll('[data-page]').forEach(b=>b.disabled=p===1&&['first','prev'].includes(b.dataset.page)||p===8&&['last','next'].includes(b.dataset.page))}if(button.dataset.privacy){const on=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(on));button.setAttribute('aria-label',on?'隐私模式':'查看');button.innerHTML=icon(id,on?'eye-off':'eye',18)}if(button.dataset.list){const grid=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(grid));button.setAttribute('aria-label',grid?'封面视图':'列表视图');button.innerHTML=icon(id,grid?'grid':'list',18)}});
document.getElementById('theme').onclick=function(){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';this.setAttribute('aria-pressed',String(dark));try{localStorage.setItem('nohentai-icon-direction-theme',dark?'dark':'light')}catch{}};
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=Number(b.dataset.size);document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});
document.getElementById('color').onclick=function(){brand=!brand;document.documentElement.style.setProperty('--brand',brand?'var(--accent)':'var(--text)');this.setAttribute('aria-pressed',String(brand));this.textContent=brand?'品牌色':'单色';};
document.getElementById('find').addEventListener('input',render);
document.getElementById('copy').onclick=async()=>{if(!selected)return;const text=`我选择图标方案 ${selected}「${sets[selected].title}」。前台 F、Admin B 的 Logo 保持不变。`;const status=document.getElementById('status');try{await navigator.clipboard.writeText(text);status.textContent='已复制，可发回对话。';clearTimeout(copyTimer);copyTimer=setTimeout(()=>status.textContent='',5000)}catch{const input=document.getElementById('copy-fallback');input.hidden=false;input.value=text;input.focus();input.select();status.textContent='可手动复制选择结果。'}};
try{const t=localStorage.getItem('nohentai-icon-direction-theme');if(t==='dark'){document.documentElement.dataset.theme='dark';document.getElementById('theme').setAttribute('aria-pressed','true')}choose(localStorage.getItem('nohentai-icon-direction'))}catch{}render();
</script></body></html>
