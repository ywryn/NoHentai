<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark">
<title>NoHentai · Logo 方案</title><link id="review-favicon" rel="icon" type="image/svg+xml" href="assets/current-favicon.svg">
<style>
:root{font-family:Inter,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light;--bg:#f6f7f4;--panel:#fff;--ink:#29352f;--muted:#6a756d;--line:#dce3d9;--soft:#f0f3ed;--accent:#37644e;--contrast:#fff;--shadow:#14261b10}
:root[data-theme=dark]{color-scheme:dark;--bg:#151819;--panel:#1d2220;--ink:#e7eeea;--muted:#a2afa7;--line:#39433c;--soft:#242c27;--accent:#a2d2b7;--contrast:#183124;--shadow:#0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}button,input,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{font:inherit;cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}
.topbar{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:3}.topbar-inner{max-width:1440px;margin:auto;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}.identity{display:flex;align-items:baseline;gap:12px}.identity strong{font-size:16px;letter-spacing:-.04em}.identity span{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:20px}.top-actions>a{font-size:12px;text-decoration:none;color:var(--muted)}.theme-switch{display:flex;padding:3px;background:var(--soft);border:1px solid var(--line);border-radius:7px}.theme-switch button{border:0;border-radius:4px;padding:6px 12px;background:none;color:var(--muted);min-height:34px;font-size:12px}.theme-switch button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
main{max-width:1440px;margin:auto;padding:38px 32px 140px}.intro{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:28px}.intro h1{font-size:27px;font-weight:600;letter-spacing:-.035em;margin:0 0 9px}.intro p{margin:0;font-size:13px;line-height:1.7;color:var(--muted)}.intro small{font-size:11px;color:var(--muted);white-space:nowrap}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.proposal{min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column;position:relative}.proposal[data-selected=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.proposal-header{padding:18px 18px 0;display:flex;align-items:baseline;gap:10px}.letter{font:500 13px ui-monospace,SFMono-Regular,monospace;color:var(--muted)}.proposal h2{font-size:15px;font-weight:600;letter-spacing:-.02em;margin:0}.artboard{height:235px;display:flex;align-items:center;justify-content:center;position:relative;padding:20px}.logo-large{width:100%;height:100%;object-fit:contain;display:block}.zoom-button{position:absolute;right:12px;bottom:10px;min-height:36px;border:0;border-radius:5px;color:var(--muted);background:var(--panel);padding:5px 9px;font-size:11px}.zoom-button:hover{color:var(--ink);background:var(--soft)}.proposal-body{padding:0 18px 18px;flex:1;display:flex;flex-direction:column}.rationale{margin:0 0 19px;color:var(--muted);font-size:12px;line-height:1.8;min-height:44px}.nav-preview{display:flex;align-items:center;justify-content:center;gap:9px;min-height:66px;background:var(--bg);border:1px solid var(--line);border-radius:5px}.nav-preview img{width:34px;height:34px;object-fit:contain}.nav-preview span{font-size:16px;font-weight:600;letter-spacing:-.04em}.size-preview{display:flex;align-items:flex-end;justify-content:center;gap:25px;padding:18px 0 17px}.sample{display:flex;align-items:center;justify-content:flex-end;flex-direction:column;gap:6px;min-height:50px}.sample img{object-fit:contain;display:block}.sample small{font:10px ui-monospace,SFMono-Regular,monospace;color:var(--muted)}.proposal-actions{display:flex;align-items:center;gap:10px;padding-top:14px;margin-top:auto;border-top:1px solid var(--line)}.choose-label{display:flex;align-items:center;gap:7px;min-height:44px;flex:1;cursor:pointer;font-size:12px}.choose-label input{accent-color:var(--accent);width:17px;height:17px;margin:0}.download{font-size:11px;color:var(--muted);padding:12px 0 12px 8px;text-decoration:none;white-space:nowrap}.download:hover{text-decoration:underline;color:var(--ink)}.footnote{margin-top:22px;display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:11px;line-height:1.8}.footnote p{margin:0}.footnote a{text-decoration:none;white-space:nowrap}.footnote a:hover{text-decoration:underline}
.selection-bar{position:fixed;bottom:0;left:0;right:0;z-index:4;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}.selection-inner{max-width:1440px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 32px}.selection-copy{min-width:0}.selection-copy strong{display:block;font-size:13px;font-weight:550}.selection-copy span{display:block;font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}.copy-button{min-height:44px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--contrast);padding:9px 20px;white-space:nowrap;font-size:12px}.copy-fallback{display:block;margin-top:8px;width:min(600px,100%);padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}.live-status{min-height:16px;font-size:11px;color:var(--accent);margin-top:4px}
dialog{width:min(620px,calc(100% - 28px));max-height:calc(100dvh - 32px);overflow:auto;margin:auto;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}dialog::backdrop{background:#0d171b80}.dialog-heading{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}.dialog-heading h2{font-size:15px;margin:0;font-weight:550}.dialog-close{border:0;background:none;color:var(--muted);width:44px;height:44px;font-size:25px}.dialog-art{height:min(58vh,460px);padding:24px}.dialog-art img{width:100%;height:100%;object-fit:contain;display:block}.dialog-footer{border-top:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:15px}.dialog-footer span{font-size:11px;color:var(--muted)}.dialog-footer button{border:1px solid var(--line);border-radius:5px;background:var(--soft);color:var(--ink);padding:8px 14px;min-height:44px;font-size:12px}.image-error{position:absolute;inset:70px 15px auto;text-align:center;color:var(--muted);font-size:12px}
@media(min-width:1500px){.artboard{height:270px}}
@media(max-width:1100px){.options{grid-template-columns:repeat(2,minmax(0,1fr))}.artboard{height:250px}.rationale{min-height:0}.intro small{display:none}}
@media(max-width:600px){.topbar-inner{padding:10px 16px;gap:8px}.identity{gap:7px;flex-direction:column}.identity strong{font-size:14px}.identity span{font-size:10px}.top-actions{gap:8px}.top-actions>a{display:none}.theme-switch button{min-height:36px;padding:6px 11px}main{padding:26px 16px 155px}.intro{margin-bottom:20px}.intro h1{font-size:22px;line-height:1.4}.intro p{font-size:12px}.options{grid-template-columns:1fr;gap:18px}.proposal-header{padding-top:16px}.artboard{height:230px;padding:20px 40px}.proposal-body{padding-bottom:14px}.rationale{margin-bottom:14px}.nav-preview{min-height:60px}.size-preview{padding:14px 0}.selection-inner{padding:12px 16px;gap:12px;align-items:center}.selection-copy span{max-width:220px;font-size:10px}.copy-button{padding:9px 12px}.footnote{flex-direction:column;gap:8px}.dialog-footer span{max-width:180px}.proposal-actions{padding-top:8px}.choose-label,.download{min-height:44px}}
@media(prefers-reduced-motion:no-preference){.proposal{transition:border-color .15s ease,box-shadow .15s ease}.zoom-button,.copy-button{transition:background-color .15s ease}}
</style>
<script>try{const t=localStorage.getItem('nohentai-logo-review-theme');document.documentElement.dataset.theme=t==='dark'||t==='light'?t:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch{}</script>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="identity"><strong>NoHentai</strong><span>Logo 方案比较</span></div><div class="top-actions"><a href="https://nohentai.com/" target="_blank" rel="noopener noreferrer">查看当前网站 ↗</a><div class="theme-switch" role="group" aria-label="预览底色"><button type="button" data-theme-choice="light" aria-pressed="true">浅底</button><button type="button" data-theme-choice="dark" aria-pressed="false">深底</button></div></div></div></header>
<main><div class="intro"><div><h1>F 的两种细化方向。</h1><p>原版 F、弧线收笔 G、紧凑轮廓 H，比较轮廓平衡与小尺寸效果。</p></div><small>透明 PNG · 概念提案</small></div><div class="options" id="options" role="group" aria-label="Logo 方案对比"></div><div class="footnote"><p>选定方向后，再细化字标、矢量文件和正式应用尺寸。</p><a href="icons.html">已选 G / B · 查看图标集 ↗</a><a href="generation-notes.txt" target="_blank" rel="noopener">生成提示词与素材清单 ↗</a></div></main>
<footer class="selection-bar"><div class="selection-inner"><div class="selection-copy"><strong id="selection-heading">还没有选择</strong><span id="selection-help">选好后复制方案编号，发回对话即可。</span><div class="live-status" id="copy-status" role="status" aria-live="polite"></div><input id="copy-fallback" class="copy-fallback" readonly aria-label="选择结果，可手动复制" hidden></div><button id="copy-choice" class="copy-button" type="button" disabled>复制选择</button></div></footer>
<dialog id="zoom" aria-labelledby="zoom-title"><div class="dialog-heading"><h2 id="zoom-title"></h2><button class="dialog-close" id="close-zoom" type="button" aria-label="关闭大图">×</button></div><div class="dialog-art"><img id="zoom-image" width="512" height="512" alt=""></div><div class="dialog-footer"><span>可用 ← / → 切换全部方案。</span><button id="choose-from-zoom" type="button">选择这个方案</button><a id="zoom-download" class="download" download>下载 PNG ↗</a></div></dialog>
<script>
'use strict';
const concepts=[
 {id:'G',name:'の字 · 弧线收笔',color:'#b75b7d',description:'减轻右下角的重量，用弧线收笔保留回旋动势。'},
 {id:'H',name:'の字 · 紧凑轮廓',color:'#b75b7d',description:'更紧凑的外轮廓与较大的内部留白，侧重小图标表现。'},
 {id:'A',name:'の字回环',color:'#b75b7d',description:'延续现有「の」的记忆点，以回环与折页收笔表达阅读。'},
 {id:'E',name:'の字 · 大折角',color:'#b75b7d',description:'放大三角折角，让折页同时改变外轮廓与内部留白。'},
 {id:'F',name:'の字 · 简式收笔',color:'#b75b7d',description:'以宽阔留白和利落收笔表达翻页，减少小尺寸中的细节。'},
 {id:'B',name:'藏书字母',color:'#527b62',description:'将 NH 与并排的书脊合为一体，突出收藏与资料库属性。'},
 {id:'C',name:'漫画分镜',color:'#b85f45',description:'用分镜留白和翻页折角，直接传达漫画与内容浏览。'},
 {id:'D',name:'折页纸鹤',color:'#8470a0',description:'把书页与折纸的轮廓结合，保留轻盈的日本文化意象。'}
];
concepts.sort((a,b)=>['F','G','H','A','E','B','C','D'].indexOf(a.id)-['F','G','H','A','E','B','C','D'].indexOf(b.id));
const byId=id=>concepts.find(c=>c.id===id),source=c=>`assets/logo-${c.id.toLowerCase()}.png`;
let selected=null,zoomed=0,copyTimer;
const dialog=document.getElementById('zoom'),options=document.getElementById('options');
for(const c of concepts){
 const article=document.createElement('article');article.className='proposal';article.dataset.id=c.id;article.dataset.selected='false';
 article.innerHTML=`<div class="proposal-header"><span class="letter">${c.id}</span><h2>${c.name}</h2></div><div class="artboard"><img class="logo-large" src="${source(c)}" alt="方案 ${c.id}：${c.name}" width="512" height="512" decoding="async"><button class="zoom-button" type="button" aria-label="放大方案 ${c.id}" data-zoom="${c.id}">放大 ↗</button></div><div class="proposal-body"><p class="rationale">${c.description}</p><div class="nav-preview" aria-label="方案 ${c.id} 导航栏尺寸预览"><img src="${source(c)}" width="34" height="34" alt=""><span>NoHentai</span></div><div class="size-preview" aria-label="方案 ${c.id} 小尺寸预览">${[16,24,32].map(n=>`<div class="sample"><img src="${source(c)}" width="${n}" height="${n}" alt="${n} 像素标识"><small>${n}px</small></div>`).join('')}</div><div class="proposal-actions"><label class="choose-label"><input type="radio" name="logo-choice" value="${c.id}">选择方案 ${c.id}</label><a class="download" href="${source(c)}" download="NoHentai-logo-${c.id}.png">下载 PNG ↗</a></div></div>`;
 options.append(article);
}
function choose(id){
 const c=byId(id);if(!c)return;selected=id;
 try{localStorage.setItem('nohentai-logo-review-choice',id)}catch{}
 document.querySelectorAll('.proposal').forEach(card=>{card.dataset.selected=String(card.dataset.id===id);card.querySelector('input').checked=card.dataset.id===id});
 document.getElementById('selection-heading').textContent=`已选 ${id} · ${c.name}`;
 document.getElementById('selection-help').textContent='本标签页图标已同步预览。复制选择后发回对话。';
 document.getElementById('copy-choice').disabled=false;document.getElementById('copy-status').textContent='';document.getElementById('copy-fallback').hidden=true;
 const favicon=document.getElementById('review-favicon');favicon.type='image/png';favicon.href=source(c);
}
function applyTheme(theme){document.documentElement.dataset.theme=theme;try{localStorage.setItem('nohentai-logo-review-theme',theme)}catch{}document.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===theme)))}
function updateZoom(){const c=concepts[zoomed],img=document.getElementById('zoom-image');img.src=source(c);img.alt=`方案 ${c.id}：${c.name} 大图`;document.getElementById('zoom-title').textContent=`${c.id} · ${c.name}`;const link=document.getElementById('zoom-download');link.href=source(c);link.download=`NoHentai-logo-${c.id}.png`}
options.addEventListener('change',e=>{if(e.target.name==='logo-choice')choose(e.target.value)});
options.addEventListener('click',e=>{const button=e.target.closest('[data-zoom]');if(button){zoomed=concepts.findIndex(c=>c.id===button.dataset.zoom);updateZoom();dialog.showModal()}});
document.querySelectorAll('[data-theme-choice]').forEach(button=>button.addEventListener('click',()=>applyTheme(button.dataset.themeChoice)));
document.getElementById('close-zoom').addEventListener('click',()=>dialog.close());
document.getElementById('choose-from-zoom').addEventListener('click',()=>{choose(concepts[zoomed].id);dialog.close();document.querySelector(`input[value="${selected}"]`).focus()});
dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();zoomed=(zoomed+(e.key==='ArrowRight'?1:concepts.length-1))%concepts.length;updateZoom()}});
dialog.addEventListener('click',e=>{const r=dialog.getBoundingClientRect();if(e.target===dialog&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))dialog.close()});
document.getElementById('copy-choice').addEventListener('click',async()=>{if(!selected)return;const c=byId(selected),text=`我选择 NoHentai Logo 方案 ${c.id}「${c.name}」，希望以此方向继续完善。`;const status=document.getElementById('copy-status');try{await navigator.clipboard.writeText(text);status.textContent='已复制，可以发回对话。';clearTimeout(copyTimer);copyTimer=setTimeout(()=>status.textContent='',5000)}catch{const input=document.getElementById('copy-fallback');input.value=text;input.hidden=false;input.focus();input.select();status.textContent='可手动复制下方选择结果。'}});
document.querySelectorAll('.logo-large').forEach(img=>img.addEventListener('error',()=>{const message=document.createElement('span');message.className='image-error';message.setAttribute('role','alert');message.textContent='图片暂未加载成功，请刷新后重试。';img.after(message)}));
applyTheme(document.documentElement.dataset.theme);try{const previous=localStorage.getItem('nohentai-logo-review-choice');if(byId(previous))choose(previous)}catch{}
</script>
</body></html>
