<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark"><link rel="icon" href="assets/logo-g.png"><title>NoHentai · 字标方案</title>
<style>
@font-face{font-family:NHNunito;src:url(wordmark-fonts/nunito.ttf) format('truetype');font-weight:200 1000;font-display:swap}
@font-face{font-family:NHOutfit;src:url(wordmark-fonts/outfit.ttf) format('truetype');font-weight:100 900;font-display:swap}

:root{color-scheme:light;--bg:#f6f7f4;--panel:#fff;--ink:#29352f;--muted:#69766e;--line:#dce3d9;--soft:#edf1e9;--accent:#ac4c74;--tint:#ac4c7410;--on-accent:#fff;--small-size:18px;font:14px system-ui,"Noto Sans CJK SC",sans-serif}html[data-theme=dark]{color-scheme:dark;--bg:#151a18;--panel:#1d2420;--ink:#e7eeea;--muted:#a2afa7;--line:#3a453e;--soft:#263029;--accent:#efa0c0;--tint:#efa0c010;--on-accent:#32222b}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg)}button,input{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-underline-offset:4px}button,a{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{cursor:default;opacity:.4}[hidden]{display:none!important}.bar{border-bottom:1px solid var(--line)}.bar-inner,main,.selection-inner{max-width:1240px;margin:auto;padding-inline:28px}.bar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:66px}.identity{font-size:14px;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:8px}.identity img{width:34px;height:34px;object-fit:contain}.bar-actions{display:flex;align-items:center;gap:20px;font-size:12px}.theme{display:flex;border:1px solid var(--line);background:var(--soft);border-radius:5px;padding:3px;gap:2px}.theme button{border:0;min-height:34px;padding:6px 12px;font-size:12px;background:transparent;border-radius:3px;color:var(--muted)}.theme button[aria-pressed=true]{background:var(--panel);color:var(--ink)}main{padding-top:32px;padding-bottom:160px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}.intro h1{font-size:27px;letter-spacing:-.04em;font-weight:600;margin:0 0 10px}.intro p{color:var(--muted);font-size:13px;margin:0;line-height:1.8}.small-control{display:flex;align-items:center;gap:10px;white-space:nowrap}.small-control>span{font-size:11px;color:var(--muted)}.size-options{display:flex;border:1px solid var(--line);border-radius:5px;padding:3px;gap:2px}.size-options button{border:0;min-height:34px;background:transparent;padding:6px 9px;color:var(--muted);font-size:11px;border-radius:3px}.size-options button[aria-pressed=true]{background:var(--panel);color:var(--ink)}.options{display:grid;grid-template-columns:1fr 1fr;gap:24px}.proposal{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}.proposal[data-selected=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.heading{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;gap:12px}.heading h2{font-size:14px;font-weight:550;margin:0}.heading h2 small{font:11px ui-monospace,monospace;color:var(--muted);margin-right:10px}.choose{padding:7px 12px;min-height:40px;border:1px solid var(--line);border-radius:5px;background:transparent;font-size:11px}.choose[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--tint)}.lockup{display:flex;align-items:center;justify-content:center;gap:10px;min-height:158px;padding:20px 22px}.lockup img{width:78px;height:78px;object-fit:contain}.word{display:inline-block;line-height:1.1;white-space:nowrap;font-synthesis:none}.a .word{font-family:NHNunito,sans-serif;font-weight:850;letter-spacing:-.04em}.b .word{font-family:NHOutfit,sans-serif;font-weight:650;letter-spacing:-.035em;transform:skewX(-8deg);transform-origin:50% 75%}.c .word{font-family:NHFraunces,serif;font-style:italic;font-weight:600;letter-spacing:-.035em;font-variation-settings:'opsz' 30,'SOFT' 20,'WONK' 0}.d .word{font-family:NHSora,sans-serif;font-weight:650;letter-spacing:-.06em}.lockup .word{font-size:43px}.rationale{margin:0;padding:0 20px 20px;color:var(--muted);font-size:12px;line-height:1.8;min-height:62px}.usage{padding:18px 20px 20px;border-top:1px solid var(--line);background:var(--bg)}.preview-label{font-size:10px;color:var(--muted);margin:0 0 9px}.desktop{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}.compact-brand{display:flex;align-items:center;gap:6px;min-width:0;flex-shrink:0}.compact-brand img{width:40px;height:40px;object-fit:contain}.compact-brand .word{font-size:var(--small-size)}.nav{display:flex;gap:14px;font-size:10px;color:var(--muted)}.nav span:first-child{color:var(--accent)}.phone{max-width:390px;margin:auto;border:1px solid var(--line);border-radius:7px;background:var(--panel);overflow:hidden}.phone-header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:58px;padding-inline:12px;border-bottom:1px solid var(--line)}.tools{display:flex;gap:5px}.tools span{display:flex;width:28px;height:28px;justify-content:center;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:4px}.tools svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.phone-body{padding:17px 16px 18px}.phone-title{display:flex;align-items:baseline;gap:10px;font-size:17px;letter-spacing:-.03em}.phone-title small{font-size:10px;color:var(--muted)}.search{border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--muted);font-size:10px;padding:9px 10px;margin-top:14px;display:flex;align-items:center;gap:7px}.search svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}.mono{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted)}.mono .word{font-size:24px}.mono small{font-size:9px;font-family:system-ui,sans-serif;margin-left:12px}.notes{font-size:11px;color:var(--muted);margin-top:22px;line-height:1.8;display:flex;justify-content:space-between;gap:16px}.selection{position:fixed;inset-inline:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}.selection-inner{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px}.selection strong{display:block;font-size:13px}.selection p{font-size:11px;color:var(--muted);line-height:1.7;margin:4px 0 0}.copy{min-height:44px;border:0;border-radius:5px;background:var(--accent);color:var(--on-accent);padding:10px 20px;font-size:12px;white-space:nowrap}.status{font-size:11px;color:var(--accent);min-height:16px;margin-top:3px}.fallback{display:block;width:100%;margin-top:7px;background:var(--bg);border:1px solid var(--line);padding:7px}.load-note{font-size:11px;color:var(--muted);margin-top:12px;min-height:16px}
@media(max-width:1050px){.nav{gap:8px}.nav span:nth-child(n+4){display:none}.intro{align-items:flex-start;flex-direction:column;gap:16px}.lockup .word{font-size:38px}.lockup img{width:68px;height:68px}}
@media(max-width:720px){.options{grid-template-columns:1fr;gap:20px}.bar-inner,main,.selection-inner{padding-inline:18px}.bar-actions{gap:12px}.bar-actions>a{display:none}main{padding-top:26px}.intro h1{font-size:23px}.intro p{font-size:12px}.heading{padding:14px 16px}.lockup{min-height:145px;gap:6px;padding-inline:12px}.lockup .word{font-size:40px}.rationale{min-height:0;padding-inline:16px;font-size:11px}.usage{padding-inline:14px}.nav{gap:12px}.nav span:nth-child(n+4){display:inline}.notes{flex-direction:column;gap:6px}.selection p{font-size:10px;max-width:220px}.copy{padding-inline:14px}}
@media(max-width:390px){.lockup .word{font-size:35px}.lockup img{width:60px;height:60px}.phone-header{padding-inline:8px}.tools span{width:25px;height:28px}.tools{gap:3px}.compact-brand{gap:3px}.nav span:nth-child(n+4){display:none}.word{max-width:100%}.small-control{gap:8px}}
</style></head><body>
<header class="bar"><div class="bar-inner"><a class="identity" href="./"><img src="assets/logo-g.png" alt="">NoHentai · 字标</a><div class="bar-actions"><a href="https://nohentai.com/" target="_blank" rel="noopener noreferrer">查看正式站</a><div class="theme" role="group" aria-label="预览底色"><button type="button" data-theme="light" aria-pressed="true">浅底</button><button type="button" data-theme="dark" aria-pressed="false">深底</button></div></div></div></header>
<main><div class="intro"><div><h1>为 G，找到合适的字标。</h1><p>同一个 Logo，四种文字气质。比较完整组合，也看真实顶栏尺寸。</p></div><div class="small-control"><span>顶栏字号</span><div class="size-options" role="group" aria-label="顶栏字号"><button type="button" data-size="16" aria-pressed="false">16px</button><button type="button" data-size="18" aria-pressed="true">18px</button><button type="button" data-size="20" aria-pressed="false">20px</button></div></div></div><div class="options" id="options"></div><div class="load-note" id="font-status" role="status">正在加载字标字体…</div><footer class="notes"><span>仅调整 NoHentai 品牌文字，正文、按钮与 Admin 标识保持原样。</span><a href="wordmark-notes.txt" target="_blank" rel="noopener">字体来源与授权</a></footer></main>
<footer class="selection"><div class="selection-inner"><div><strong id="selected">选择你喜欢的字标风格</strong><p>选好后复制方案编号，发回对话即可。</p><div class="status" id="status" role="status" aria-live="polite"></div><input class="fallback" id="fallback" readonly aria-label="手动复制字标选择" hidden></div><button type="button" id="copy" class="copy" disabled>复制选择</button></div></footer>
<script>
const specs=[{id:'A',name:'柔圆',font:'Nunito',desc:'圆润饱满的字形呼应「の」的弧线，紧凑而亲近。'},{id:'B',name:'轻行',font:'Outfit',desc:'轻微前倾与干净的几何字形，延续 G 的回旋动势。'},{id:'C',name:'书卷',font:'Fraunces',desc:'带有笔意的斜体衬线，强调收藏与阅读的气质。'},{id:'D',name:'刻线',font:'Sora',desc:'更紧凑的几何骨架，用清晰的转折对照柔和的图形。'}];
let selected=null;const tools=`<span><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4ZM14 4h6v6h-6ZM4 14h6v6H4ZM14 14h6v6h-6Z"/></svg></span><span><svg viewBox="0 0 24 24"><path d="M3 12s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="3"/></svg></span><span><svg viewBox="0 0 24 24"><path d="M19 14A8 8 0 0 1 10 4a8 8 0 1 0 9 10Z"/></svg></span>`;
const brand=`<img src="assets/logo-g.png" alt=""><span class="word">NoHentai</span>`;
for(const s of specs){const el=document.createElement('article');el.className=`proposal ${s.id.toLowerCase()}`;el.dataset.id=s.id;el.dataset.selected='false';el.innerHTML=`<header class="heading"><h2><small>${s.id}</small>${s.name}</h2><button class="choose" type="button" data-choose="${s.id}" aria-pressed="false">选择 ${s.id}</button></header><div class="lockup" aria-label="方案 ${s.id} 标识组合">${brand}</div><p class="rationale">${s.desc}</p><div class="usage"><p class="preview-label">桌面顶栏</p><div class="desktop"><div class="compact-brand">${brand}</div><div class="nav" aria-hidden="true"><span>首页</span><span>统计</span><span>书单</span><span>每日</span><span>翻译</span></div></div><p class="preview-label">手机顶栏</p><div class="phone"><div class="phone-header"><div class="compact-brand">${brand}</div><div class="tools" aria-hidden="true">${tools}</div></div><div class="phone-body"><div class="phone-title">收藏画廊<small>4,246 部</small></div><div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>搜索标题、作者、标签…</div></div></div><div class="mono"><span class="word">NoHentai</span><small>单独字标</small></div></div>`;document.getElementById('options').append(el)}
function choose(id){const s=specs.find(x=>x.id===id);if(!s)return;selected=id;document.querySelectorAll('.proposal').forEach(e=>e.dataset.selected=String(e.dataset.id===id));document.querySelectorAll('[data-choose]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choose===id)));document.getElementById('selected').textContent=`已选字标 ${id} · ${s.name}`;document.getElementById('copy').disabled=false;document.getElementById('status').textContent='';document.getElementById('fallback').hidden=true;try{localStorage.setItem('nohentai-wordmark-choice',id)}catch{}}
document.getElementById('options').onclick=e=>{const b=e.target.closest('[data-choose]');if(b)choose(b.dataset.choose)};
function theme(t){document.documentElement.dataset.theme=t;document.querySelectorAll('button[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===t)));try{localStorage.setItem('nohentai-wordmark-theme',t)}catch{}}
document.querySelectorAll('button[data-theme]').forEach(b=>b.onclick=()=>theme(b.dataset.theme));document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--small-size',b.dataset.size+'px');document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
document.getElementById('copy').onclick=async()=>{const s=specs.find(x=>x.id===selected);if(!s)return;const text=`我选择 NoHentai 字标方案 ${s.id}「${s.name}」，主 Logo 保持 G。`;try{await navigator.clipboard.writeText(text);document.getElementById('status').textContent='已复制，可发回对话。'}catch{const e=document.getElementById('fallback');e.hidden=false;e.value=text;e.focus();e.select();document.getElementById('status').textContent='可手动复制选择结果。'}};
try{choose(localStorage.getItem('nohentai-wordmark-choice'));theme(localStorage.getItem('nohentai-wordmark-theme')==='dark'?'dark':'light')}catch{}
Promise.all([document.fonts.load('850 18px NHNunito'),document.fonts.load('650 18px NHOutfit'),document.fonts.load('italic 600 18px NHFraunces'),document.fonts.load('650 18px NHSora')]).then(()=>{document.getElementById('font-status').textContent='';document.documentElement.dataset.fonts='ready'}).catch(()=>{document.getElementById('font-status').textContent='部分字体未加载成功，请刷新后再比较。';document.documentElement.dataset.fonts='error'});
</script></body></html>
