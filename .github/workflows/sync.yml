name: Sync Data and Deploy

on:
  schedule:
    - cron: '0 20 * * *'   # 每天 UTC 20:00（北京时间 04:00）全量同步
    - cron: '0 4 * * *'    # 每天 UTC 04:00（北京时间 12:00）Telegram 增量同步
    - cron: '0 12 * * *'   # 每天 UTC 12:00（北京时间 20:00）Telegram 增量同步
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r app/requirements.txt

      - name: Write .env from secrets
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 20 * * *'
        run: |
          cat > .env <<EOF
          EXHENTAI_BASE_URL=${{ secrets.EXHENTAI_BASE_URL }}
          EXHENTAI_COOKIE_MEMBER_ID=${{ secrets.EXHENTAI_COOKIE_MEMBER_ID }}
          EXHENTAI_COOKIE_PASS_HASH=${{ secrets.EXHENTAI_COOKIE_PASS_HASH }}
          EXHENTAI_COOKIE_IGNEOUS=${{ secrets.EXHENTAI_COOKIE_IGNEOUS }}
          EOF

      - name: Run sync script
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 20 * * *'
        run: python app/sync_script.py

      - name: Run Google Sheets sync script
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 20 * * *'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python app/sync_sheets.py

      - name: Sync EhTagTranslation Database
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 20 * * *'
        run: python app/sync_translations.py

      - name: Run Daily Search sync
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 20 * * *'
        run: python app/sync_daily_search.py

      - name: Ensure media release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view telegram-media-archive 2>/dev/null || \
          gh release create telegram-media-archive \
            --title "Telegram Media Archive" \
            --notes "Auto-managed by sync workflow. Do not edit manually." \
            --prerelease

      - name: Download existing media archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download telegram-media-archive \
            --pattern "telegram_media.zip" \
            --dir web-static/public/data/ 2>/dev/null || true
          if [ -f web-static/public/data/telegram_media.zip ]; then
            unzip -q -o web-static/public/data/telegram_media.zip \
              -d web-static/public/data/
            rm web-static/public/data/telegram_media.zip
          fi

      - name: Sync Telegram forwards
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_ENCRYPTION_PASSWORD: ${{ secrets.TELEGRAM_ENCRYPTION_PASSWORD }}
        run: python app/sync_telegram.py

      - name: Package and upload media archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d web-static/public/data/telegram_media ]; then
            cd web-static/public/data
            zip -r telegram_media.zip telegram_media/
            cd -
            gh release upload telegram-media-archive \
              web-static/public/data/telegram_media.zip --clobber
            rm -rf web-static/public/data/telegram_media/
            rm -f web-static/public/data/telegram_media.zip
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            git add web-static/public/data/galleries.json \
                    web-static/public/data/backup_data/ \
                    web-static/public/data/future_digi.json \
                    web-static/public/data/translations.json \
                    web-static/public/data/daily_search.json \
                    web-static/public/data/telegram_forwards.json
            git diff --staged --quiet || git commit -m "常规数据更新 [skip ci]"
          else
            git add web-static/public/data/telegram_forwards.json
            git diff --staged --quiet || git commit -m "Telegram 数据更新 [skip ci]"
          fi
          git push

  build:
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download media archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download telegram-media-archive \
            --pattern "telegram_media.zip" \
            --dir web-static/public/data/ 2>/dev/null || true
          if [ -f web-static/public/data/telegram_media.zip ]; then
            unzip -q -o web-static/public/data/telegram_media.zip \
              -d web-static/public/data/
            rm web-static/public/data/telegram_media.zip
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: web-static
        run: npm install

      - name: Build
        working-directory: web-static
        run: npm run build     # prebuild 自动触发 generate-stats.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-static/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
