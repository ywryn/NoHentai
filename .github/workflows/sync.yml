name: Sync Data and Deploy

on:
  schedule:
    - cron: '0 20 * * *'   # 每天 UTC 20:00（北京时间 04:00）
  workflow_dispatch:

permissions:
  contents: write          # 需要 push 回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r app/requirements.txt

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          EXHENTAI_BASE_URL=${{ secrets.EXHENTAI_BASE_URL }}
          EXHENTAI_COOKIE_MEMBER_ID=${{ secrets.EXHENTAI_COOKIE_MEMBER_ID }}
          EXHENTAI_COOKIE_PASS_HASH=${{ secrets.EXHENTAI_COOKIE_PASS_HASH }}
          EXHENTAI_COOKIE_IGNEOUS=${{ secrets.EXHENTAI_COOKIE_IGNEOUS }}
          EOF

      - name: Run sync script
        run: python app/sync_script.py

      - name: Run Google Sheets sync script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python app/sync_sheets.py

      - name: Sync EhTagTranslation Database
        run: python app/sync_translations.py

      - name: Run Daily Search sync
        run: python app/sync_daily_search.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web-static/public/data/galleries.json \
                  web-static/public/data/backup_data/ \
                  web-static/public/data/future_digi.json \
                  web-static/public/data/translations.json \
                  web-static/public/data/daily_search.json
          git diff --staged --quiet || git commit -m "常规数据更新 [skip ci]"
          git push

  build:
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master          # 拉取 sync job 刚 push 的最新提交

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: web-static
        run: npm install

      - name: Build
        working-directory: web-static
        run: npm run build     # prebuild 自动触发 generate-stats.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-static/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
