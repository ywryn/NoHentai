# Install in /etc/nginx/sites-available/nohentai and symlink into sites-enabled.
# Set your real domain and enable HTTPS with certbot before logging into admin.
limit_req_zone $binary_remote_addr zone=nohentai_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name nohentai.com www.nohentai.com;
    root /srv/nohentai/www/current;
    index index.html;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Never record image-source query strings or other user input in access logs.
    location /api/ {
        access_log off;
        limit_req zone=nohentai_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    # ALL /data requests go to Python, including unknown names (404).
    # Never fall back to old files, overrides, or backups from a static build.
    location /data/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-store always;
    }
    location ~ /\. { deny all; }
    location = /sw.js {
        add_header Cache-Control no-cache;
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control no-cache;
        try_files $uri $uri/ /index.html;
    }
}
